DATA:
  MAX_SAMPLE_INTERVAL: 400
  SAMPLER_MODE: memory
  MEMORY_MAX_STRIDE: 4
  MULTI_MODAL_LANGUAGE: True
  MULTI_MODAL_VISION: True
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 224
    NUMBER: 4
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 112
    NUMBER: 1
  TRAIN:
    DATASETS_NAME:
    - VASTTRACK
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 10000
  USE_NLP:
    TNL2K: True
    VASTTRACK: True
    LASOT: True
MODEL:
  ENCODER:
    TYPE: fastitpnb
    STRIDE: 16
    PRETRAIN_TYPE: pretrained/itpn/fast_itpn_base_clipl_e1600.pt
    PATCHEMBED_INIT: halfcopy
    DROP_PATH: 0.1
    LANGUAGE_MODEL: CLIP
  TEXT_ENCODER:
    TYPE: ViT-L/14
    SLICING_MODE: full
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
    CONV_TYPE: normal
    XAVIER_INIT: True
  PRETRAINED_MODEL: /root/MVLM/models/MVLM_TF.pth.tar
  MEMORY:
    ENABLED: True
    SHORT_CAPACITY: 8
    LONG_CAPACITY: 16
    ROI_SIZE: 2
    HIDDEN_DIM: 256
    KEY_DIM: 128
    USE_SEMANTIC: True
    MIN_QUALITY: 0.5
    NOVELTY_THRESHOLD: 0.1
    SHORT_DECAY: 0.1
    LONG_DECAY: 0.01
TRAIN:
  TYPE: memory
  MEMORY_FREEZE_HEAD: True
  MEMORY_PREDICTED_PROB: 0.5
  BATCH_SIZE: 2
  EPOCH: 10
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 8
  NUM_WORKER: 2
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001
  CM_LOSS: False
TEST:
  EPOCH: 10
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 224
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 112
  WINDOW: True
  NUM_TEMPLATES: 1
  MEMORY_ALLOW_UNTRAINED: False
  MULTI_MODAL_VISION:
    DEFAULT: True
  MULTI_MODAL_LANGUAGE:
    DEFAULT: True
  USE_NLP:
    DEFAULT: True
  MVLM:
    ALPHA_CORR: 0.7
    TAU: 0.03
    OMEGA: 0.2
    LAMBDA: 0.4
    PSI_OUT: 0.1
