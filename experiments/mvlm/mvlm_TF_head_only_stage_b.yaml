# Development configuration. Budget: TRAIN.WORLD.MAX_STEPS; BATCH_SIZE is per process.
# Use an explicit audited train/validation manifest; this file does not start training.
DATA:
  MAX_SAMPLE_INTERVAL: 400
  MULTI_MODAL_LANGUAGE: true
  MULTI_MODAL_VISION: true
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 224
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 112
    NUMBER: 1
  TRAIN:
    DATASETS_NAME:
    - LASOT
    - VASTTRACK
    - TNL2K_train
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 100000
    VASTTRACK_SPLIT: lib/train/data_specs/vasttrack_train_split.txt
    TNL2K_EXCLUDE_SEQUENCES:
    - Fight_game_004-Done
  USE_NLP:
    TNL2K: true
    VASTTRACK: true
    LASOT: true
MODEL:
  ENCODER:
    TYPE: fastitpnb
    STRIDE: 16
    PRETRAIN_TYPE: pretrained/itpn/fast_itpn_base_clipl_e1600.pt
    PATCHEMBED_INIT: halfcopy
    DROP_PATH: 0.1
    LANGUAGE_MODEL: CLIP
  TEXT_ENCODER:
    TYPE: ViT-L/14
    SLICING_MODE: full
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
    CONV_TYPE: normal
    XAVIER_INIT: true
  PRETRAINED_MODEL: null
  MEMORY:
    ENABLED: false
    HIDDEN_DIM: 256
    KEY_DIM: 128
    ROI_SIZE: 2
    SHORT_CAPACITY: 8
    LONG_CAPACITY: 16
    MIN_QUALITY: 0.5
    NOVELTY_THRESHOLD: 0.1
    USE_SEMANTIC: true
    SHORT_DECAY: 0.1
    LONG_DECAY: 0.01
    WRITE_CONSISTENCY: 0.2
  WORLD:
    ENABLED: true
    HISTORY: 4
    HIDDEN: 256
    LAYERS: 2
    HEADS: 4
    FUSION_STRENGTH: 1.0
    MIN_QUALITY: 0.0
    QUALITY_ENABLED: true
    QUALITY_WEIGHT: 0.25
  FUSION:
    MODE: cross_attention
    CHANNELS: 256
TRAIN:
  BATCH_SIZE: 2
  GRAD_CLIP_NORM: 1.0
  LR: 0.0001
  NUM_WORKER: 2
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: cosine
  WEIGHT_DECAY: 0.0001
  CM_LOSS: false
  CM_WEIGHT: 0.5
  FREEZE_ENCODER: true
  WORLD:
    STAGE: B
    HEAD_LR: 1.0e-05
    APPEARANCE_WEIGHT: 1.0
    MOTION_WEIGHT: 1.0
    FEATURE_WEIGHT: 0.1
    QUALITY_LOSS_WEIGHT: 0.5
    PREDICTED_HISTORY_PROB: 0.5
    HISTORY_RAMP_STEPS: 1000
    CLIP_LENGTH: 12
    MAX_STEPS: 4000
    SAVE_INTERVAL: 200
    SEED: 20261108
    TRAIN_HEAD: true
    FREEZE_BN_STATS: true
    HEAD_ONLY: true
    WARMUP_FRAMES: 4
    MAX_STRIDE: 4
TEST:
  EPOCH: 60
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 224
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 112
  WINDOW: true
  NUM_TEMPLATES: 1
  UPDATE_INTERVALS:
    DEFAULT: 1
  UPDATE_THRESHOLD:
    DEFAULT: 0.7
  MULTI_MODAL_VISION:
    DEFAULT: true
  MULTI_MODAL_LANGUAGE:
    DEFAULT: true
  USE_NLP:
    DEFAULT: true
    TNL2K: true
    VASTTRACK: true
    LASOT: true
  MVLM:
    ALPHA_CORR: 1.0
    TAU: 0.1
    OMEGA: 0.4
    LAMBDA: 0.4
    PSI_OUT: 0.0
