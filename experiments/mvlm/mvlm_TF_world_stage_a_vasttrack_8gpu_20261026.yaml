# torchrun: 8 GPUs x per-GPU batch 2 = global batch 16. Fresh official initialization.
DATA:
  MAX_SAMPLE_INTERVAL: 400
  MULTI_MODAL_LANGUAGE: true
  MULTI_MODAL_VISION: true
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 224
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 112
    NUMBER: 1
  TRAIN:
    DATASETS_NAME:
    - VASTTRACK
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 100000
  USE_NLP:
    TNL2K: true
    VASTTRACK: true
    LASOT: true
MODEL:
  ENCODER:
    TYPE: fastitpnb
    STRIDE: 16
    PRETRAIN_TYPE: pretrained/itpn/fast_itpn_base_clipl_e1600.pt
    PATCHEMBED_INIT: halfcopy
    DROP_PATH: 0.1
    LANGUAGE_MODEL: CLIP
  TEXT_ENCODER:
    TYPE: ViT-L/14
    SLICING_MODE: full
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
    CONV_TYPE: normal
    XAVIER_INIT: true
  PRETRAINED_MODEL: null
  WORLD:
    ENABLED: true
    HISTORY: 4
    HIDDEN: 256
    LAYERS: 2
    HEADS: 4
    FUSION_STRENGTH: 1.0
    MIN_QUALITY: 0.0
TRAIN:
  TYPE: world
  ENCODER_MULTIPLIER: 0.1
  BATCH_SIZE: 2
  EPOCH: 60
  GRAD_CLIP_NORM: 1.0
  LR: 0.0001
  LR_DROP_EPOCH: 54
  NUM_WORKER: 0
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 10
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001
  CM_LOSS: false
  CM_WEIGHT: 0.5
  FREEZE_ENCODER: true
  WORLD:
    STAGE: A
    HEAD_LR: 1.0e-05
    APPEARANCE_WEIGHT: 1.0
    MOTION_WEIGHT: 1.0
    FEATURE_WEIGHT: 0.1
    PREDICTED_HISTORY_PROB: 0.5
    HISTORY_RAMP_STEPS: 1000
    CLIP_LENGTH: 8
    MAX_STEPS: 4000
    SAVE_INTERVAL: 200
    SEED: 20261022
TEST:
  EPOCH: 60
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 224
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 112
  WINDOW: true
  NUM_TEMPLATES: 1
  UPDATE_INTERVALS:
    DEFAULT: 1
  UPDATE_THRESHOLD:
    DEFAULT: 0.7
  MULTI_MODAL_VISION:
    DEFAULT: true
  MULTI_MODAL_LANGUAGE:
    DEFAULT: true
  USE_NLP:
    DEFAULT: true
    TNL2K: true
    VASTTRACK: true
    LASOT: true
  MVLM:
    ALPHA_CORR: 1.0
    TAU: 0.1
    OMEGA: 0.4
    LAMBDA: 0.4
    PSI_OUT: 0.0
